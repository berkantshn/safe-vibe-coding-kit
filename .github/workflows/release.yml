# Made By FALCREB
# v ile başlayan her tag'de indirilebilir zip paketini GitHub Releases'e yükler.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: zip -r safe-vibe-coding-kit.zip en tr scripts README.md LICENSE
      - run: sha256sum safe-vibe-coding-kit.zip > safe-vibe-coding-kit.zip.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" safe-vibe-coding-kit.zip safe-vibe-coding-kit.zip.sha256 --generate-notes --verify-tag
